<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ecossistema do Biogás · CP2b</title>
  <meta name="description" content="Do resíduo à energia: um diorama animado do ecossistema do biogás e do biometano, dos coprodutos e dos certificados ambientais. CP2b – Centro Paulista de Estudos em Biogás e Bioprodutos.">
  <meta name="theme-color" content="#1E3E4C">
  <link rel="icon" href="assets/cp2b-logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/scene.css">
  <link rel="stylesheet" href="styles/panel.css">
  <link rel="stylesheet" href="styles/figures.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="https://cp2b.unicamp.br/pilar2b/pt-BR" target="_blank" rel="noopener">
      <img src="assets/cp2b-logo.svg" alt="CP2b — Centro Paulista de Estudos em Biogás e Bioprodutos" width="96" height="37">
    </a>
    <div class="titles">
      <h1>Ecossistema do Biogás</h1>
      <p>Do resíduo à energia, aos coprodutos e ao valor ambiental</p>
    </div>
    <nav class="modes" aria-label="Modo de visualização">
      <button type="button" id="btn-overview" class="pill on" aria-pressed="true">Visão geral</button>
      <button type="button" id="btn-tour" class="pill" aria-pressed="false">Tour guiado</button>
    </nav>
  </header>

  <main class="app">
    <section class="map" id="map" aria-label="Diorama do ecossistema">
      <svg id="world" role="img" aria-labelledby="world-title" preserveAspectRatio="xMidYMid meet">
        <title id="world-title">Diorama isométrico animado: lavouras, pecuária, agroindústria e cidade enviam resíduos a uma usina de biogás; dela saem eletricidade, biometano para a rede e para um posto, CO₂ e biofertilizante. Na universidade, o CP2b conecta a pesquisa a empresas e governo.</title>
      </svg>
      <div class="loading" id="loading">Montando o ecossistema…</div>
      <div class="legend" id="legend" aria-label="Legenda e camadas"></div>
      <button type="button" class="back-overview" id="back-overview" hidden>⤺ Visão geral</button>
    </section>

    <aside class="panel" id="panel" aria-live="polite">
      <button type="button" class="sheet-handle" id="sheet-handle" aria-label="Expandir ou recolher painel"><span></span></button>
      <div class="panel-body" id="panel-body"></div>
      <footer class="panel-nav" id="panel-nav">
        <button type="button" id="prev" class="nav-btn" aria-label="Etapa anterior">‹</button>
        <div class="progress" id="progress"></div>
        <button type="button" id="next" class="nav-btn primary" aria-label="Próxima etapa">›</button>
      </footer>
    </aside>
  </main>

  <script type="module" src="src/main.mjs"></script>
</body>
</html>
