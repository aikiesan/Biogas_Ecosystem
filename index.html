<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ecossistema do Biogás · CP2b</title>
  <meta name="description" content="Do resíduo à energia: um diorama animado do ecossistema do biogás e do biometano, dos coprodutos e dos certificados ambientais. CP2b – Centro Paulista de Estudos em Biogás e Bioprodutos.">
  <meta name="theme-color" content="#1E3E4C">
  <link rel="icon" href="assets/cp2b-logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/scene.css">
  <link rel="stylesheet" href="styles/panel.css">
  <link rel="stylesheet" href="styles/figures.css">
  <link rel="stylesheet" href="styles/life.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="https://cp2b.unicamp.br/pilar2b/pt-BR" target="_blank" rel="noopener">
      <img src="assets/cp2b-logo.svg" alt="CP2b — Centro Paulista de Estudos em Biogás e Bioprodutos" width="96" height="37">
    </a>
    <div class="titles">
      <h1>Ecossistema do Biogás</h1>
      <p>Do resíduo à energia, aos coprodutos e ao valor ambiental</p>
    </div>
    <nav class="modes" aria-label="Modo de visualização">
      <button type="button" id="btn-overview" class="pill on" aria-pressed="true">Visão geral</button>
      <button type="button" id="btn-tour" class="pill" aria-pressed="false">Tour guiado</button>
    </nav>
  </header>

  <main class="app">
    <section class="map" id="map" aria-label="Diorama do ecossistema">
      <div class="sky-night" id="sky-night"></div>
      <div id="world" class="layers" role="img" aria-label="Diorama isométrico animado: lavouras, pecuária, agroindústria e cidade enviam resíduos a uma usina de biogás; dela saem eletricidade, biometano para a rede e para um posto, CO₂ e biofertilizante. Na universidade, o CP2b conecta a pesquisa a empresas e governo."></div>
      <div class="loading" id="loading">Montando o ecossistema…</div>
      <div class="hud" id="hud">
        <div class="clock"><span class="ico" id="clk-ico">☀</span><b id="clk-time">10:00</b><span id="clk-month">junho</span><span class="season" id="clk-season">safra</span><button type="button" id="clk-pause" aria-label="Pausar o relógio">❚❚</button></div>
        <div class="hud-k">Desde que você abriu esta página</div>
        <div class="hud-row"><span class="hud-v" id="hud-pot">0</span><span class="hud-u">m³ de metano que os resíduos de SP poderiam gerar</span></div>
        <div class="hud-bar"><i id="hud-bar-real"></i></div>
        <div class="hud-row small"><span class="hud-v2" id="hud-real">0</span><span class="hud-u">m³ cabem na capacidade de biometano instalada hoje</span></div>
        <div class="hud-eq" id="hud-eq"></div>
        <div class="gasbar" title="Nível do gasômetro da usina">Gasômetro <span><i id="gas-lvl"></i></span></div>
        <button type="button" class="journey-btn" id="journey-btn">▶ Siga o carbono</button>
      </div>
      <div class="caption" id="caption" hidden><div class="cap-step" id="cap-step"></div><div class="cap-text" id="cap-text"></div></div>
      <div class="tip" id="tip" hidden></div>
      <div class="legend" id="legend" aria-label="Legenda e camadas"></div>
      <button type="button" class="back-overview" id="back-overview" hidden>⤺ Visão geral</button>
    </section>

    <aside class="panel" id="panel" aria-live="polite">
      <button type="button" class="sheet-handle" id="sheet-handle" aria-label="Expandir ou recolher painel"><span></span></button>
      <div class="panel-body" id="panel-body"></div>
      <footer class="panel-nav" id="panel-nav">
        <button type="button" id="prev" class="nav-btn" aria-label="Etapa anterior">‹</button>
        <div class="progress" id="progress"></div>
        <button type="button" id="next" class="nav-btn primary" aria-label="Próxima etapa">›</button>
      </footer>
    </aside>
  </main>

  <script type="module" src="src/main.mjs"></script>
</body>
</html>
